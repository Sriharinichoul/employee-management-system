
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee | Employee Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Employee Management System</h1>

        <div>
            <span id="headerAdminName">Admin</span>

            <a href="admin-profile.html">
                Profile
            </a>

            <a href="#" id="adminLogout">
                Logout
            </a>
        </div>
    </header>


    <!-- Main Layout -->
    <main>

        <!-- Sidebar -->
        <aside>
            <nav>
                <a href="admin-dashboard.html">
                    Dashboard
                </a>

                <a href="employees.html" class="active">
                    Employees
                </a>

                <a href="departments.html">
                    Departments
                </a>

                <a href="#">
                    Attendance
                </a>

                <a href="#">
                    Leave Management
                </a>

                <a href="#">
                    Reports
                </a>

                <a href="#">
                    Settings
                </a>
            </nav>
        </aside>


        <!-- Page Content -->
        <section>

            <h2>Edit Employee</h2>

            <p>
                Update the employee's department, manager, designation and employment status.
            </p>


            <!-- Employee Information -->
            <div class="employee-edit-form">

                <h3>Employee Information</h3>

                <form id="employeeForm">

                    <!-- Employee ID -->
                    <div class="form-group">
                        <label for="employeeId">
                            Employee ID
                        </label>

                        <input
                            type="text"
                            id="employeeId"
                            readonly
                        >
                    </div>


                    <!-- Email -->
                    <div class="form-group">
                        <label for="email">
                            Company Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            readonly
                        >
                    </div>


                    <!-- Department -->
                    <div class="form-group">
                        <label for="department">
                            Department
                        </label>

                        <select id="department" required>
                            <option value="">
                                Select Department
                            </option>
                        </select>
                    </div>


                    <!-- Manager -->
                    <div class="form-group">
                        <label for="manager">
                            Manager
                        </label>

                        <select id="manager" required>
                            <option value="">
                                Select Manager
                            </option>
                        </select>
                    </div>


                    <!-- Designation -->
                    <div class="form-group">
                        <label for="designation">
                            Designation
                        </label>

                        <input
                            type="text"
                            id="designation"
                            required
                        >
                    </div>


                    <!-- Joining Date -->
                    <div class="form-group">
                        <label for="joiningDate">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            id="joiningDate"
                            required
                        >
                    </div>


                    <!-- Status -->
                    <div class="form-group">
                        <label for="status">
                            Employment Status
                        </label>

                        <select id="status" required>
                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>
                        </select>
                    </div>


                    <!-- Buttons -->
                    <div class="form-buttons">

                        <button type="submit">
                            Update Employee
                        </button>

                        <button
                            type="button"
                            id="cancelEdit"
                            class="cancel-button"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>
            &copy; 2026 Employee Management System
        </p>
    </footer>


    <!-- JavaScript -->
    <script src="js/edit-employee.js"></script>

</body>

</html>
