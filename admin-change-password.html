<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Change Password | Employee Management System
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header>

    <h1>
        Employee Management System
    </h1>

    <div>

        <span id="headerAdminName">
            Admin
        </span>

        <a href="admin-profile.html">
            Profile
        </a>

        <a
            href="#"
            id="adminLogout"
        >
            Logout
        </a>

    </div>

</header>


<main>


    <aside>

        <nav>

            <a href="admin-dashboard.html">
                Dashboard
            </a>

            <a href="employees.html">
                Employees
            </a>

            <a href="departments.html">
                Departments
            </a>

            <a href="#">
                Attendance
            </a>

            <a href="#">
                Leave Management
            </a>

            <a href="#">
                Reports
            </a>

            <a href="admin-profile.html">
                My Profile
            </a>

            <a href="admin-change-password.html">
                Change Password
            </a>

        </nav>

    </aside>


    <section>

        <h2>
            Change Password
        </h2>

        <p>
            Update your administrator account password.
        </p>


        <form
            id="adminChangePasswordForm"
            class="employee-form"
        >


            <div class="form-group">

                <label for="currentPassword">
                    Current Password
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    required
                >

            </div>


            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="8"
                    required
                >

            </div>


            <div class="form-buttons">

                <button type="submit">
                    Change Password
                </button>

                <a
                    href="admin-dashboard.html"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>


        </form>

    </section>

</main>


<footer>

    Employee Management System

</footer>


<script src="js/admin-change-password.js"></script>

</body>

</html>
