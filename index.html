<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PeopleDesk | Employee Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card">

        <section class="intro" aria-label="Employee portal">

            <div class="brand">
                <span class="logo" aria-hidden="true">✦</span>
                PeopleDesk
            </div>

            <div class="intro-copy">

                <p class="kicker">Employee management</p>

                <h1>
                  Connecting People and Work
                </h1>

                <p>Stay connected.</p>

            </div>

            <div class="tagline">
                A simpler way to work together.
            </div>

        </section>


        <section class="login" aria-labelledby="login-title">

            <div class="content">

                <h2 id="login-title">Welcome back</h2>

                <p class="sub">
                  Enter your account details to sign in.
                </p>


                <form id="login-form" novalidate>

                    <div class="field">

                        <label for="email">
                            Work email
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="username"
                            placeholder="name@peopledesk.com"
                            required
                        >

                    </div>


                    <div class="field">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrap">

                            <input
                                id="password"
                                name="password"
                                type="password"
                                autocomplete="current-password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                class="show"
                                type="button"
                                aria-label="Show password"
                                aria-controls="password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <div class="options">

                        <label class="remember">
                            <input name="remember" type="checkbox">
                            Remember me
                        </label>

                        <a href="mailto:it-support@example.com?subject=Password%20reset">
                            Forgot password?
                        </a>

                    </div>


                    <button class="submit" type="submit">
                        Sign in
                    </button>


                    <p
                        class="message"
                        id="message"
                        role="status"
                        aria-live="polite"
                    ></p>

                </form>


                <p class="help">
                    Need help? Contact your company administrator.
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

  </body>

</html>
