<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Employee | Employee Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Employee Management System</h1>

        <div>
            <span>Admin</span>

            <a href="admin-profile.html">Profile</a>

            <a href="index.html">Logout</a>
        </div>
    </header>

    <!-- Main Layout -->
    <main>

        <!-- Sidebar -->
        <aside>
            <nav>
                <a href="admin-dashboard.html">Dashboard</a>

                <a href="employees.html">Employees</a>

                <a href="departments.html">Departments</a>

                <a href="#">Attendance</a>

                <a href="#">Leave Management</a>

                <a href="#">Reports</a>

                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Page Content -->
        <section>

            <h2>Add Employee</h2>

            <p>
                Add a new employee to the Employee Management System.
            </p>

            <!-- Employee Form -->
            <div class="employee-form">

                <form id="employeeForm">

                    <!-- Employee ID -->
                    <div class="form-group">

                        <label for="employeeId" class="required-field">
                            Employee ID
                        </label>

                        <input
                            type="text"
                            id="employeeId"
                            placeholder="Enter Employee ID"
                            autocomplete="off"
                            required
                        >

                        <small>
                            Employee ID is allocated by the administrator.
                        </small>

                    </div>

                    <!-- Employee Email -->
                    <div class="form-group">

                        <label for="email" class="required-field">
                            Company Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="employee@company.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <!-- Department -->
                    <div class="form-group">

                        <label for="department" class="required-field">
                            Department
                        </label>

                        <select id="department" required>

                            <option value="">
                                Select Department
                            </option>

                        </select>

                    </div>

                    <!-- Manager -->
                    <div class="form-group">

                        <label for="manager" class="required-field">
                            Manager
                        </label>

                        <select id="manager" required>

                            <option value="">
                                Select Manager
                            </option>

                        </select>

                    </div>

                    <!-- Designation -->
                    <div class="form-group">

                        <label for="designation" class="required-field">
                            Designation
                        </label>

                        <input
                            type="text"
                            id="designation"
                            placeholder="Enter designation"
                            required
                        >

                    </div>

                    <!-- Joining Date -->
                    <div class="form-group">

                        <label for="joiningDate" class="required-field">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            id="joiningDate"
                            required
                        >

                    </div>

                    <!-- Status -->
                    <div class="form-group">

                        <label for="status" class="required-field">
                            Employment Status
                        </label>

                        <select id="status" required>

                            <option value="Active">
                                Active
                            </option>

                            <option value="Inactive">
                                Inactive
                            </option>

                        </select>

                    </div>

                    <!-- Buttons -->
                    <div class="form-buttons">

                        <button type="submit">
                            Add Employee
                        </button>

                        <a href="employees.html">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer>
        Employee Management System
    </footer>

    <!-- JavaScript -->
    <script src="js/add-employee.js"></script>

</body>

</html>
