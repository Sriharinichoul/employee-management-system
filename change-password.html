<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Change Password | Employee Management System
    </title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header>

    <h1>
        Employee Management System
    </h1>

    <div>

        <span id="headerEmployeeName">
            Employee
        </span>

        <a href="employee-profile.html">
            Profile
        </a>

        <a href="#" id="employeeLogout">
            Logout
        </a>

    </div>

</header>


<main>


    <aside>

        <nav>

            <a href="employee-dashboard.html">
                Dashboard
            </a>

            <a href="employee-profile.html">
                My Profile
            </a>

            <a href="employee-dashboard.html#employeeSearchSection">
                Search Employees
            </a>

            <a href="employee-dashboard.html#departmentSearchSection">
                Search Departments
            </a>

            <a href="change-password.html">
                Change Password
            </a>

        </nav>

    </aside>


    <section>

        <h2>
            Change Password
        </h2>

        <p>
            Update your employee account password.
        </p>


        <form
            id="changePasswordForm"
            class="employee-form"
        >


            <div class="form-group">

                <label for="currentPassword">
                    Current Password
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    required
                >

            </div>


            <div class="form-group">

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    required
                    minlength="8"
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    required
                    minlength="8"
                >

            </div>


            <div class="form-buttons">

                <button type="submit">
                    Change Password
                </button>

                <a
                    href="employee-dashboard.html"
                    class="cancel-button"
                >
                    Cancel
                </a>

            </div>


        </form>


    </section>


</main>


<footer>
    Employee Management System
</footer>


<script src="js/change-password.js"></script>


</body>

</html>
